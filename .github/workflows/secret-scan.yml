name: Secret Scan

# Varre o histórico (push) e o diff (pull_request) atrás de segredos.
# Configuração de ignores em /.gitguardian.yml.
#
# Requer o secret GITGUARDIAN_API_KEY no repositório:
#   Settings → Secrets and variables → Actions → New repository secret
#   (gere o token em https://dashboard.gitguardian.com → API → Personal access tokens)
# Sem o secret, o job FALHA de propósito — é um gate de segurança, não opcional.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanning:
    name: GitGuardian scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ggshield precisa do histórico completo para varrer commits novos.
          fetch-depth: 0

      - name: GitGuardian scan
        uses: GitGuardian/ggshield-action@v1
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
