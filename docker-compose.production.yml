# Brain Sentry — homologação / produção standalone (host único)
#
# O caminho canônico de produção é o Docker Swarm com imagens do GHCR e
# Docker secrets — veja docs/deploy/swarm-deploy.md. Este compose cobre
# homologação (ou produção pequena) num host único com a MESMA topologia:
#
#   browser ──▶ frontend (nginx, única porta publicada)
#                  ├── /        SPA React
#                  └── /api/*   proxy ──▶ brainsentry-backend:8081 (Go)
#                                             ├── postgres (pgvector)
#                                             └── falkordb
#
# O backend NÃO publica porta no host; só é alcançável via proxy do nginx.
# TLS fica a cargo de um proxy externo (Traefik/Caddy/nginx do host).
#
# Uso:
#   cp .env.production.example .env       # preencha os obrigatórios
#   docker compose -f docker-compose.production.yml up -d --build
#   # migrations (primeira vez e a cada release que adicionar migration):
#   docker compose -f docker-compose.production.yml --profile migrate run --rm migrate
#
# Variáveis SEM default (compose falha se ausentes — proposital):
#   POSTGRES_PASSWORD, JWT_SECRET, BRAINSENTRY_AI_AGENTIC_MODEL_API_KEY,
#   CORS_ORIGINS, FALKORDB_VERSION

services:
  postgres:
    # pgvector é obrigatório — migration 000008 cria colunas/índices vetoriais.
    image: pgvector/pgvector:pg16
    container_name: brainsentry-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brainsentry}
      POSTGRES_USER: ${POSTGRES_USER:-brainsentry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - brainsentry-net

  falkordb:
    # Tag pinada via env — sem default de propósito: "latest" em produção
    # já quebrou deploys com pull de versão incompatível.
    image: falkordb/falkordb:${FALKORDB_VERSION:?pine uma versão no .env, ex. FALKORDB_VERSION=v4.2.2}
    container_name: brainsentry-falkordb
    environment:
      # FalkorDB é cache derivado (rebuild-able), mas persistir evita
      # reconstruir o grafo inteiro a cada restart.
      FALKORDB_ARGS: "--dir /data"
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - brainsentry-net

  brainsentry-backend:
    build:
      context: ./brain-sentry-go
      dockerfile: Dockerfile
    image: ghcr.io/integrall-tech/brainsentry-backend:${BRAINSENTRY_VERSION:-local}
    container_name: brainsentry-backend
    # O nginx do frontend resolve o upstream por este nome (docker/nginx.conf).
    hostname: brainsentry-backend
    environment:
      # production liga as validações fail-closed do boot: recusa JWT secret
      # default/curto e demo auth; sslmode default vira require.
      BRAINSENTRY_ENV: production
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-brainsentry}
      DB_USER: ${POSTGRES_USER:-brainsentry}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # O postgres deste compose não tem certificados TLS e a rede é privada
      # do host; por isso o opt-out explícito. Com Postgres gerenciado/externo,
      # troque para require ou verify-full no .env.
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      REDIS_HOST: falkordb
      REDIS_PORT: "6379"
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (>=32 chars)}
      BRAINSENTRY_AI_AGENTIC_MODEL_API_KEY: ${BRAINSENTRY_AI_AGENTIC_MODEL_API_KEY:?defina a API key do provider LLM no .env}
      AI_MODEL: ${BRAINSENTRY_AI_MODEL:-anthropic/claude-haiku-4-5}
      # Sem default com localhost: liste só as origens reais do front.
      CORS_ORIGINS: ${CORS_ORIGINS:?defina CORS_ORIGINS no .env, ex. https://app.suaempresa.com}
      TZ: ${TZ:-America/Sao_Paulo}
    # Nenhuma porta publicada: acesso só via proxy /api do frontend.
    depends_on:
      postgres:
        condition: service_healthy
      falkordb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - brainsentry-net

  brainsentry-frontend:
    build:
      context: ./brain-sentry-frontend
      dockerfile: Dockerfile
    image: ghcr.io/integrall-tech/brainsentry-frontend:${BRAINSENTRY_VERSION:-local}
    container_name: brainsentry-frontend
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - brainsentry-backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - brainsentry-net

  # Backup diário do Postgres com retenção (pg_dump → /backups).
  # Aponte ./backups para um volume/disco que saia da máquina (rsync, S3...).
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: brainsentry-postgres-backup
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-brainsentry}
      POSTGRES_USER: ${POSTGRES_USER:-brainsentry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - brainsentry-net

  # Aplica as migrations em ordem (idempotentes — IF NOT EXISTS), uma vez:
  #   docker compose -f docker-compose.production.yml --profile migrate run --rm migrate
  # O binário do backend NÃO auto-migra (decisão registrada no Dockerfile).
  migrate:
    image: pgvector/pgvector:pg16
    profiles: ["migrate"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./brain-sentry-go/internal/repository/postgres/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        psql -h postgres -U ${POSTGRES_USER:-brainsentry} -d ${POSTGRES_DB:-brainsentry} \
          -c "CREATE EXTENSION IF NOT EXISTS vector;"
        for f in $(ls /migrations/*.up.sql | sort); do
          echo "==> $$f"
          psql -h postgres -U ${POSTGRES_USER:-brainsentry} -d ${POSTGRES_DB:-brainsentry} \
            -v ON_ERROR_STOP=1 -f "$$f"
        done
        echo "migrations OK"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - brainsentry-net

volumes:
  postgres_data:
    driver: local
  falkordb_data:
    driver: local

networks:
  brainsentry-net:
    driver: bridge
